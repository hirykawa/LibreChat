version: 1.3.0
cache: true

endpoints:
  custom:
    - name: 'OpenCode Go'
      apiKey: 'user_provided'
      baseURL: 'https://opencode.ai/zen/go/v1'
      headers:
        x-opencode-session: 'librechat-default'
        user-agent: 'LibreChat/0.8.8'
      models:
        default:
          - 'glm-5.3'
          - 'glm-5.3-flash'
          - 'glm-5.2'
          - 'glm-5.1'
          - 'kimi-k3'
          - 'kimi-k2.7-code'
          - 'kimi-k2.6'
          - 'deepseek-v4-pro'
          - 'deepseek-v4.1-flash'
          - 'deepseek-v4-flash'
          - 'longcat-2.0'
          - 'mimo-v2.6-flash'
          - 'mimo-v2.6-pro'
          - 'minimax-m3'
          - 'minimax-m2.7'
          - 'qwen3.8-max'
          - 'qwen3.8-flash'
          - 'qwen3.7-plus'
          - 'hy3'
        fetch: false
      titleConvo: true
      titleModel: 'glm-5.3-flash'
      modelDisplayLabel: 'OpenCode Go'
